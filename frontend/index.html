<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 Quel Film ? | Movie Finder for TikTok & Reels</title>
    <meta
      name="description"
      content="Trouve le nom d'un film à partir d'une vidéo TikTok, Instagram Reels ou YouTube Shorts. Find any movie or anime from a video link instantly. Shazam for movies!"
    />
    <meta
      name="keywords"
      content="trouver film avec lien, movie finder bot, shazam pour film, identifier anime tiktok, find movie from instagram reel, nom du film IA, video to movie search, youtube shorts movie finder"
    />
    <meta name="author" content="ShadowFrame" />
    <meta
      property="og:title"
      content="🎬 Quel Film ? - Shazam for TikTok & Insta Videos"
    />
    <meta
      property="og:description"
      content="Colle le lien de ton TikTok ou Reel, notre IA trouve le film et te dit où le regarder en streaming."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format"
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🎬 Quel Film ? - Movie Finder Bot" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #00ffcc;
        --accent: #ff007f;
        --bg: #050505;
        --card: #0e0e12;
      }
      body {
        background-color: var(--bg);
        color: #e0e6ed;
        font-family: "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        background-image: radial-gradient(
          circle at 50% 0%,
          #1a0b2e 0%,
          #050505 70%
        );
      }
      #lang-selector {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(31, 40, 51, 0.8);
        color: var(--primary);
        border: 1px solid var(--primary);
        padding: 5px;
        border-radius: 5px;
        cursor: pointer;
        backdrop-filter: blur(5px);
      }

      /* Barre de navigation dynamique */
      .genre-nav {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .btn-genre {
        background: #1a1a24;
        color: var(--primary);
        padding: 8px 15px;
        border-radius: 20px;
        text-decoration: none;
        border: 1px solid var(--primary);
        font-size: 0.8rem;
        transition: 0.3s;
      }
      .btn-genre:hover {
        background: var(--primary);
        color: #000;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4.5rem);
        color: var(--primary);
        text-shadow:
          2px 2px 0px var(--accent),
          4px 4px 0px #450892;
        margin-top: 50px;
        text-align: center;
        text-transform: uppercase;
        font-weight: 900;
      }
      .search-container {
        display: flex;
        width: 100%;
        max-width: 600px;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        flex-grow: 1;
        padding: 15px;
        background: rgba(20, 20, 25, 0.8);
        color: var(--primary);
        border: 2px solid #333;
        border-radius: 8px;
        outline: none;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }

      #resultat,
      #genre-grid {
        display: none;
        width: 100%;
        max-width: 500px;
        background: var(--card);
        padding: 25px;
        border-radius: 15px;
        border: 1px solid #333;
        margin-top: 30px;
        text-align: left;
      }
      #affiche_film {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
        display: none;
      }
      .badge {
        background: #00a8e1;
        padding: 3px 8px;
        border-radius: 5px;
        margin: 2px;
        display: inline-block;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <select id="lang-selector" onchange="changerLangueManuellement()">
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="zh">🇨🇳 中文</option>
    </select>

    <nav id="genre-nav" class="genre-nav"></nav>

    <h1>
      <i class="fas fa-video"></i> <span data-i18n="title">QUEL FILM ?</span>
    </h1>

    <div class="search-container">
      <input
        type="url"
        id="lien_video"
        data-i18n-ph="placeholder"
        placeholder="Colle ton lien..."
      />
      <button onclick="analyserVideo()">
        <i class="fas fa-search"></i> <span data-i18n="btn">TROUVER</span>
      </button>
    </div>

    <div id="game-container" style="display: none; text-align: center">
      <canvas id="gameCanvas" width="300" height="150"></canvas>
    </div>

    <div id="resultat">
      <h2 id="titre_film" style="color: white; margin-top: 0"></h2>
      <img id="affiche_film" src="" />
      <p id="synopsis_film" style="font-size: 0.95rem; color: #aaa"></p>
      <div
        id="cast_section"
        style="font-size: 0.85rem; color: #ccc; margin: 10px 0"
      ></div>
      <div id="streaming_section" style="margin: 10px 0"></div>
      <a
        id="trailer_link"
        href="#"
        target="_blank"
        style="color: var(--accent); display: block; margin-top: 10px"
        >🎥 Voir la bande-annonce</a
      >
      <div
        id="similar_section"
        style="margin-top: 15px; font-size: 0.9rem; color: #888"
      ></div>
    </div>

    <div id="genre-grid">
      <h2
        id="genre-title"
        style="color: var(--primary); text-align: center"
      ></h2>
      <div
        id="movie-cards"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 15px;
        "
      ></div>
    </div>

    <script>
      // ==========================================
      // 1. SYSTÈME DE TRADUCTION DYNAMIQUE
      // ==========================================
      const dict = {
        en: {
          title: "WHICH MOVIE?",
          placeholder: "Paste TikTok, Insta or YouTube link...",
          btn: "FIND IT",
          genres: {
            horror: "Horror",
            action: "Action",
            comedy: "Comedy",
            scifi: "Sci-Fi",
            trending: "🔥 Trending",
          },
        },
        fr: {
          title: "QUEL FILM ?",
          placeholder: "Colle ton lien TikTok, Insta ou YouTube...",
          btn: "TROUVER",
          genres: {
            horror: "Horreur",
            action: "Action",
            comedy: "Comédie",
            scifi: "Science-Fiction",
            trending: "🔥 Tendances",
          },
        },
        es: {
          title: "¿QUÉ PELÍCULA?",
          placeholder: "Pega el enlace de TikTok, Insta o YouTube...",
          btn: "BUSCAR",
          genres: {
            horror: "Terror",
            action: "Acción",
            comedy: "Comedia",
            scifi: "Ciencia Ficción",
            trending: "🔥 Tendencias",
          },
        },
        de: {
          title: "WELCHER FILM?",
          placeholder: "TikTok, Insta oder YouTube Link einfügen...",
          btn: "FINDEN",
          genres: {
            horror: "Horror",
            action: "Action",
            comedy: "Komödie",
            scifi: "Science-Fiction",
            trending: "🔥 Trends",
          },
        },
        zh: {
          title: "什么电影？",
          placeholder: "粘贴 TikTok, Insta 或 YouTube 链接...",
          btn: "识别",
          genres: {
            horror: "恐怖",
            action: "动作",
            comedy: "喜剧",
            scifi: "科幻",
            trending: "🔥 热门",
          },
        },
      };

      let currentLang = "fr";

      function initLang() {
        const pathLang = window.location.pathname.replace(/\//g, "");
        if (dict[pathLang]) currentLang = pathLang;
        document.getElementById("lang-selector").value = currentLang;
        applyLang();
        genererNav();
      }

      function applyLang() {
        const t = dict[currentLang];
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.innerText = t[el.getAttribute("data-i18n")];
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          el.placeholder = t[el.getAttribute("data-i18n-ph")];
        });
      }

      function genererNav() {
        const nav =
          document.getElementById("genre-nav") || document.createElement("nav");
        nav.id = "genre-nav";
        nav.className = "genre-nav";
        const t = dict[currentLang].genres;
        nav.innerHTML = `
          <a href="/discover/horror" class="btn-genre">${t.horror}</a>
          <a href="/discover/action" class="btn-genre">${t.action}</a>
          <a href="/discover/comedy" class="btn-genre">${t.comedy}</a>
          <a href="/discover/science-fiction" class="btn-genre">${t.scifi}</a>
          <a href="/trending" class="btn-genre" style="border-color: var(--accent);">${t.trending}</a>
        `;
        if (!document.getElementById("genre-nav"))
          document.body.insertBefore(nav, document.querySelector("h1"));
      }

      // --- LOGIQUE JEU (Ninja) ---
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      let gameActive = false,
        isThrowing = 0;

      function drawNinja() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(30, 140, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = isThrowing > 0 ? "#ff007f" : "#111";
        ctx.fillRect(
          isThrowing > 0 ? 40 : 35,
          145,
          isThrowing > 0 ? 15 : 5,
          isThrowing > 0 ? 5 : 15,
        );
        ctx.fillRect(20, 150, 20, 30);
        if (isThrowing > 0) isThrowing--;
        if (Math.random() < 0.05) isThrowing = 10;
        requestAnimationFrame(drawNinja);
      }

      function changerLangueManuellement() {
        window.location.href =
          "/" + document.getElementById("lang-selector").value;
      }

      // ==========================================
      // 2. ANALYSE ET AFFICHAGE DYNAMIQUE
      // ==========================================
      async function analyserVideo() {
        const lien = document.getElementById("lien_video").value;
        if (!lien) return;

        // Active le jeu
        document.getElementById("game-container").style.display = "block";
        gameActive = true;
        drawNinja();

        const res = await fetch("/analyser", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: lien, lang: currentLang }),
        });
        const data = await res.json();
        gameActive = false;
        document.getElementById("game-container").style.display = "none";
        document.getElementById("resultat").style.display = "block";
        document.getElementById("titre_film").innerText = data.title;
        document.getElementById("affiche_film").src = data.image;
        document.getElementById("affiche_film").style.display = "block";
        document.getElementById("synopsis_film").innerText = data.synopsis;

        // Ajout des nouvelles sections enrichies
        document.getElementById("cast_section").innerHTML =
          "<strong>Casting:</strong> " +
          data.cast.map((c) => c.name).join(", ");
        document.getElementById("streaming_section").innerHTML =
          "<strong>Streaming:</strong> " +
          data.streaming.map((s) => `<span class="badge">${s}</span>`).join("");
        document.getElementById("trailer_link").href = data.trailer;
        document.getElementById("similar_section").innerHTML =
          "<strong>Tu aimeras aussi :</strong> " +
          data.similar.map((s) => s.title).join(", ");

        document.getElementById("zone_affiliation").style.display = "grid";
      }

      async function chargerGenreSiNecessaire() {
        const path = window.location.pathname.split("/");
        if ((path[1] === "discover" && path[2]) || path[1] === "trending") {
          document.querySelector(".search-container").style.display = "none";
          const res = await fetch(
            window.location.pathname + `?lang=${currentLang}`,
          );
          const data = await res.json();
          if (data.status === "success") {
            document.getElementById("genre-grid").style.display = "block";
            document.getElementById("genre-title").innerText = (
              data.genre || "TRENDING"
            ).toUpperCase();
            const container = document.getElementById("movie-cards");
            data.results.forEach((m) => {
              container.innerHTML += `<div><img src="https://image.tmdb.org/t/p/w200${m.poster_path}" style="width:100%; border-radius:8px;"><p style="font-size:0.7rem;text-align:center;">${m.title}</p></div>`;
            });
          }
        }
      }

      window.onload = () => {
        initLang();
        chargerGenreSiNecessaire();
      };
    </script>
  </body>
</html>
