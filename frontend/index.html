<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎬 Quel Film ? | Movie Finder for TikTok & Reels</title>
    <meta
      name="description"
      content="Trouve le nom d'un film à partir d'une vidéo TikTok, Instagram Reels ou YouTube Shorts. Find any movie or anime from a video link instantly. Shazam for movies!"
    />
    <meta
      name="keywords"
      content="trouver film avec lien, movie finder bot, shazam pour film, identifier anime tiktok, find movie from instagram reel, nom du film IA, video to movie search, youtube shorts movie finder"
    />
    <meta name="author" content="ShadowFrame" />
    <meta
      property="og:title"
      content="🎬 Quel Film ? - Shazam for TikTok & Insta Videos"
    />
    <meta
      property="og:description"
      content="Colle le lien de ton TikTok ou Reel, notre IA trouve le film et te dit où le regarder en streaming."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format"
    />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🎬 Quel Film ? - Movie Finder Bot" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #00ffcc;
        --accent: #ff007f;
        --bg: #050505;
        --card: #0e0e12;
      }
      body {
        background-color: var(--bg);
        color: #e0e6ed;
        font-family: "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        background-image: radial-gradient(
          circle at 50% 0%,
          #1a0b2e 0%,
          #050505 70%
        );
      }
      #lang-selector {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(31, 40, 51, 0.8);
        color: var(--primary);
        border: 1px solid var(--primary);
        padding: 5px;
        border-radius: 5px;
        cursor: pointer;
        backdrop-filter: blur(5px);
      }

      #movie-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px;
        padding-top: 20px;
      }

      /* Barre de navigation dynamique */
      .genre-nav {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .btn-genre {
        background: #1a1a24;
        color: var(--primary);
        padding: 8px 15px;
        border-radius: 20px;
        text-decoration: none;
        border: 1px solid var(--primary);
        font-size: 0.8rem;
        transition: 0.3s;
      }
      .btn-genre:hover {
        background: var(--primary);
        color: #000;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4.5rem);
        color: var(--primary);
        text-shadow:
          2px 2px 0px var(--accent),
          4px 4px 0px #450892;
        margin-top: 50px;
        text-align: center;
        text-transform: uppercase;
        font-weight: 900;
      }
      .search-container {
        display: flex;
        width: 100%;
        max-width: 600px;
        gap: 10px;
        margin-bottom: 20px;
      }
      input {
        flex-grow: 1;
        padding: 15px;
        background: rgba(20, 20, 25, 0.8);
        color: var(--primary);
        border: 2px solid #333;
        border-radius: 8px;
        outline: none;
      }
      button {
        background: var(--accent);
        color: white;
        border: none;
        padding: 15px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
      }

      #resultat,
      #genre-grid {
        display: none;
        width: 100%;
        max-width: 500px;
        background: var(--card);
        padding: 25px;
        border-radius: 15px;
        border: 1px solid #333;
        margin-top: 30px;
        text-align: left;
      }
      #affiche_film {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
        display: none;
      }
      .badge {
        background: #00a8e1;
        padding: 3px 8px;
        border-radius: 5px;
        margin: 2px;
        display: inline-block;
        font-size: 0.75rem;
      }
      /* Ajoute ça dans ton bloc <style> */
      .page-detail {
        display: none;
        background: var(--card);
        padding: 30px;
        border-radius: 20px;
        border: 1px solid var(--primary);
        width: 100%;
        max-width: 600px;
      }
      .btn-back {
        background: #333;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin-bottom: 20px;
        display: inline-block;
      }
      button {
        background: var(--primary);
        color: #000;
        border: none;
        padding: 8px 16px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        background: #444;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header
      id="main-header"
      style="
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        box-sizing: border-box;
      "
    >
      <div
        style="
          font-weight: 900;
          color: var(--primary);
          cursor: pointer;
          font-size: 1.5rem;
        "
        onclick="retourAccueil()"
      >
        🎬 QUEL FILM ?
      </div>

      <div class="search-container" style="margin: 0; width: 500px">
        <input
          type="text"
          id="input_global"
          placeholder="Colle un lien TikTok/Reel OU tape le nom d'un film..."
        />
        <button onclick="gererRechercheGlobal()">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </header>
    <select id="lang-selector" onchange="changerLangueManuellement()">
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="zh">🇨🇳 中文</option>
    </select>

    <nav id="genre-nav" class="genre-nav"></nav>

    <h1>
      <i class="fas fa-video"></i> <span data-i18n="title">QUEL FILM ?</span>
    </h1>

    <div class="search-container">
      <input
        type="url"
        id="lien_video"
        data-i18n-ph="placeholder"
        placeholder="Colle ton lien..."
      />
      <button onclick="analyserVideo()">
        <i class="fas fa-search"></i> <span data-i18n="btn">TROUVER</span>
      </button>
    </div>

    <div id="game-container" style="display: none; text-align: center">
      <canvas id="gameCanvas" width="300" height="150"></canvas>
    </div>

    <!-- Nouvelle structure de résultat -->
    <div id="page-film-detail" class="page-detail">
      <button class="btn-back" onclick="retourAccueil()">← Retour</button>
      <h2 id="titre_film"></h2>
      <img id="affiche_film" src="" style="width: 100%; border-radius: 10px" />
      <p id="synopsis_film"></p>
      <div id="streaming_section"></div>
      <iframe
        id="trailer_iframe"
        width="100%"
        height="315"
        src=""
        frameborder="0"
        allowfullscreen
      ></iframe>
    </div>

    <div id="genre-grid">
      <h2
        id="genre-title"
        style="color: var(--primary); text-align: center"
      ></h2>
      <div
        id="movie-cards"
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
          gap: 15px;
        "
      ></div>
    </div>

    <script>
      // ==========================================
      // 1. SYSTÈME DE TRADUCTION DYNAMIQUE
      // ==========================================
      const dict = {
        en: {
          title: "WHICH MOVIE?",
          placeholder: "Paste TikTok, Insta or YouTube link...",
          btn: "FIND IT",
          genres: {
            horror: "Horror",
            action: "Action",
            comedy: "Comedy",
            scifi: "Sci-Fi",
            trending: "🔥 Trending",
          },
        },
        fr: {
          title: "QUEL FILM ?",
          placeholder: "Colle ton lien TikTok, Insta ou YouTube...",
          btn: "TROUVER",
          genres: {
            horror: "Horreur",
            action: "Action",
            comedy: "Comédie",
            scifi: "Science-Fiction",
            trending: "🔥 Tendances",
          },
        },
        es: {
          title: "¿QUÉ PELÍCULA?",
          placeholder: "Pega el enlace de TikTok, Insta o YouTube...",
          btn: "BUSCAR",
          genres: {
            horror: "Terror",
            action: "Acción",
            comedy: "Comedia",
            scifi: "Ciencia Ficción",
            trending: "🔥 Tendencias",
          },
        },
        de: {
          title: "WELCHER FILM?",
          placeholder: "TikTok, Insta oder YouTube Link einfügen...",
          btn: "FINDEN",
          genres: {
            horror: "Horror",
            action: "Action",
            comedy: "Komödie",
            scifi: "Science-Fiction",
            trending: "🔥 Trends",
          },
        },
        zh: {
          title: "什么电影？",
          placeholder: "粘贴 TikTok, Insta 或 YouTube 链接...",
          btn: "识别",
          genres: {
            horror: "恐怖",
            action: "动作",
            comedy: "喜剧",
            scifi: "科幻",
            trending: "🔥 热门",
          },
        },
      };

      let currentLang = "fr";

      function initLang() {
        const pathLang = window.location.pathname.replace(/\//g, "");
        if (dict[pathLang]) currentLang = pathLang;
        document.getElementById("lang-selector").value = currentLang;
        applyLang();
        genererNav();
      }

      function applyLang() {
        const t = dict[currentLang];
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          el.innerText = t[el.getAttribute("data-i18n")];
        });
        document.querySelectorAll("[data-i18n-ph]").forEach((el) => {
          el.placeholder = t[el.getAttribute("data-i18n-ph")];
        });
      }

      function genererNav() {
        const nav =
          document.getElementById("genre-nav") || document.createElement("nav");
        nav.id = "genre-nav";
        nav.className = "genre-nav";
        const t = dict[currentLang].genres;

        // On remplace les href par des appels JS (event.preventDefault)
        nav.innerHTML = `
        <a href="#" onclick="chargerGenre('horror'); return false;" class="btn-genre">${t.horror}</a>
        <a href="#" onclick="chargerGenre('action'); return false;" class="btn-genre">${t.action}</a>
        <a href="#" onclick="chargerGenre('comedy'); return false;" class="btn-genre">${t.comedy}</a>
        <a href="#" onclick="chargerGenre('science-fiction'); return false;" class="btn-genre">${t.scifi}</a>
        <a href="#" onclick="chargerTrending(); return false;" class="btn-genre" style="border-color: var(--accent);">${t.trending}</a>
        `;
        if (!document.getElementById("genre-nav"))
          document.body.insertBefore(nav, document.querySelector("h1"));
      }

      let currentPage = 1;
      let currentGenre = "";

      async function chargerGenre(genreName, page = 1) {
        currentGenre = genreName;
        currentPage = page;

        // 1. Masquer les éléments inutiles
        document.querySelector(".search-container").style.display = "none";
        document.getElementById("page-film-detail").style.display = "none";
        document.getElementById("genre-grid").style.display = "block";
        document.getElementById("genre-title").innerText =
          genreName.toUpperCase();

        // 2. Appel unique à l'API
        const res = await fetch(
          `/discover/${genreName}?lang=${currentLang}&page=${page}`,
        );
        const data = await res.json();

        if (data.status === "success") {
          const container = document.getElementById("movie-cards");
          container.innerHTML = ""; // Vider le contenu précédent

          // 3. Génération des cartes
          data.results.forEach((m) => {
            const year = m.release_date ? m.release_date.split("-")[0] : "N/A";
            const rating = m.vote_average ? m.vote_average.toFixed(1) : "0";

            // Remplace le div de la carte par ceci :
            // Dans chargerGenre, boucle forEach :
            container.innerHTML += `
<div onclick="afficherDetails(${m.id})" 
     style="background:#1a1a24; padding:10px; border-radius:10px; transition:0.3s; cursor:pointer;" 
     onmouseover="this.style.transform='scale(1.05)'" 
     onmouseout="this.style.transform='scale(1)'">
    <img src="https://image.tmdb.org/t/p/w300${m.poster_path}" style="width:100%; border-radius:8px;">
    <h4 style="margin:10px 0 5px 0; font-size:0.9rem; height:40px; overflow:hidden;">${m.title}</h4>
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:#aaa;">
        <span>📅 ${year}</span>
        <span style="color:var(--primary);">⭐ ${rating}</span>
    </div>
</div>`;
          });

          // 4. Ajout de la pagination (Proprement à la fin)
          container.innerHTML += `
            <div style="grid-column: 1/-1; text-align:center; margin-top:20px; padding-bottom:20px;">
                <button onclick="chargerGenre('${genreName}', ${currentPage - 1})" 
                        ${currentPage === 1 ? "disabled" : ""}>Précédent</button>
                <span style="margin: 0 15px;">Page ${currentPage}</span>
                <button onclick="chargerGenre('${genreName}', ${currentPage + 1})">Suivant</button>
            </div>
        `;

          // Remonter en haut de la page pour bien voir les résultats
          window.scrollTo(0, 0);
        } else {
          alert("Genre introuvable pour le moment.");
        }
      }

      async function afficherDetails(movieId) {
        // 1. Cacher la grille et le reste
        document.getElementById("genre-grid").style.display = "none";

        // 2. Appel à l'API pour avoir tous les détails
        // Note: Tu devras peut-être ajouter une route dans app.py pour /movie/{id}
        // ou réutiliser ton analyseur si nécessaire.
        const res = await fetch(`/movie/${movieId}?lang=${currentLang}`);
        const data = await res.json();

        if (data) {
          // 3. Remplir ton bloc détail
          document.getElementById("titre_film").innerText = data.title;
          document.getElementById("affiche_film").src =
            `https://image.tmdb.org/t/p/w500${data.poster_path}`;
          document.getElementById("synopsis_film").innerText = data.overview;

          // Afficher le bloc détail
          document.getElementById("page-film-detail").style.display = "block";
          window.scrollTo(0, 0);
        }
      }

      // --- LOGIQUE JEU (Ninja) ---
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      let gameActive = false,
        isThrowing = 0;

      function drawNinja() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(30, 140, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = isThrowing > 0 ? "#ff007f" : "#111";
        ctx.fillRect(
          isThrowing > 0 ? 40 : 35,
          145,
          isThrowing > 0 ? 15 : 5,
          isThrowing > 0 ? 5 : 15,
        );
        ctx.fillRect(20, 150, 20, 30);
        if (isThrowing > 0) isThrowing--;
        if (Math.random() < 0.05) isThrowing = 10;
        requestAnimationFrame(drawNinja);
      }

      function changerLangueManuellement() {
        window.location.href =
          "/" + document.getElementById("lang-selector").value;
      }

      function retourGrille() {
        document.getElementById("page-film-detail").style.display = "none";
        document.getElementById("genre-grid").style.display = "block";
      }

      async function gererRecherche() {
        const input = document.getElementById("input_recherche").value.trim();
        if (!input) return;

        // Masquer tout le contenu actuel pour laisser place au résultat
        document.getElementById("genre-grid").style.display = "none";
        document.getElementById("page-film-detail").style.display = "none";

        // Détection : Est-ce un lien ?
        if (input.startsWith("http")) {
          // Appeler ta fonction d'analyse IA existante
          analyserVideo(input);
        } else {
          // Recherche simple par nom
          const res = await fetch(
            `/rechercher?query=${encodeURIComponent(input)}`,
          );
          const data = await res.json();
          afficherResultatsRecherche(data);
        }
      }
      // ==========================================
      // 2. ANALYSE ET AFFICHAGE DYNAMIQUE
      // ==========================================
      async function analyserVideo(lien) {
        // Affiche l'écran de chargement (le ninja)
        document.getElementById("game-container").style.display = "block";
        gameActive = true;
        drawNinja();

        const res = await fetch("/analyser", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: lien, lang: currentLang }),
        });
        const data = await res.json();

        // Arrêt du jeu
        gameActive = false;
        document.getElementById("game-container").style.display = "none";

        if (data.status === "success") {
          afficherDetailFilm(data);
        } else {
          alert("Erreur: " + data.message);
          retourAccueil();
        }
      }

      function afficherResultatsRecherche(data) {
        const container = document.getElementById("movie-cards");
        container.innerHTML = "";
        document.getElementById("genre-grid").style.display = "block";
        document.getElementById("genre-title").innerText =
          "RÉSULTATS DE RECHERCHE";

        data.results.forEach((m) => {
          container.innerHTML += `
        <div onclick="afficherDetails(${m.id})" style="background:#1a1a24; padding:10px; border-radius:10px; cursor:pointer;">
          <img src="https://image.tmdb.org/t/p/w300${m.poster_path}" style="width:100%; border-radius:8px;">
          <h4 style="margin:10px 0 0 0; font-size:0.9rem;">${m.title}</h4>
        </div>`;
        });
      }
      function afficherDetailFilm(data) {
        document.getElementById("page-film-detail").style.display = "block";
        document.getElementById("titre_film").innerText = data.title;
        document.getElementById("affiche_film").src = data.image;
        document.getElementById("synopsis_film").innerText = data.synopsis;
        // Conversion youtube watch en embed pour l'iframe
        const embedUrl = data.trailer.replace("watch?v=", "embed/");
        document.getElementById("trailer_iframe").src = embedUrl;
      }

      function retourAccueil() {
        document.getElementById("page-film-detail").style.display = "none";
        document.getElementById("genre-grid").style.display = "none";
        document.querySelector("h1").style.display = "block";
        document.querySelector(".search-container").style.display = "flex";
      }

      async function gererRechercheGlobal() {
        const input = document.getElementById("input_global").value.trim();
        if (!input) return;

        // Masquer tout le contenu existant
        document.getElementById("genre-grid").style.display = "none";
        document.getElementById("page-film-detail").style.display = "none";

        // --- LOGIQUE DE ROUTAGE ---
        if (
          input.includes("tiktok.com") ||
          input.includes("instagram.com") ||
          input.includes("youtube.com")
        ) {
          // C'est un lien : on appelle l'IA
          analyserVideo(input);
        } else {
          // C'est un texte : on cherche par nom
          const res = await fetch(
            `/rechercher?query=${encodeURIComponent(input)}`,
          );
          const data = await res.json();
          afficherResultatsRecherche(data);
        }
      }

      async function chargerGenreSiNecessaire() {
        const path = window.location.pathname.split("/");
        if ((path[1] === "discover" && path[2]) || path[1] === "trending") {
          document.querySelector(".search-container").style.display = "none";
          const res = await fetch(
            window.location.pathname + `?lang=${currentLang}`,
          );
          const data = await res.json();
          if (data.status === "success") {
            document.getElementById("genre-grid").style.display = "block";
            document.getElementById("genre-title").innerText = (
              data.genre || "TRENDING"
            ).toUpperCase();
            const container = document.getElementById("movie-cards");
            data.results.forEach((m) => {
              container.innerHTML += `<div><img src="https://image.tmdb.org/t/p/w200${m.poster_path}" style="width:100%; border-radius:8px;"><p style="font-size:0.7rem;text-align:center;">${m.title}</p></div>`;
            });
          }
        }
      }

      window.onload = () => {
        initLang();
        chargerGenreSiNecessaire();
      };
    </script>
  </body>
</html>
