version: "3.9"

services:
  api:
    build: ..
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}

  worker:
    build: ..
    command: celery -A worker.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}

  redis:
    image: redis:7
    ports:
      - "6379:6379"

redis:
  image: redis:7
  ports:
    - "6379:6379"
  volumes:
    - ./infra/redis.conf:/usr/local/etc/redis/redis.conf
  command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
