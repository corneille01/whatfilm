# infra/redis.conf — ShadowFrame production
# Objectif : cache mondial persistant des reconnaissances de films

bind 0.0.0.0
protected-mode yes
port 6379

# ── MÉMOIRE ───────────────────────────────────────────────────────
# Les clés film: sont permanentes (pas de TTL), les url: et content:
# ont des TTL. allkeys-lru évicte les moins utilisées si plein.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── PERSISTANCE RDB (snapshots) ───────────────────────────────────
# Sauvegarde sur disque → survit aux redémarrages OVH
save 900 1       # si 1 clé changée en 15 min
save 300 10      # si 10 clés changées en 5 min
save 60 1000     # si 1000 clés changées en 1 min
dbfilename dump.rdb
dir /data

# ── PERSISTANCE AOF (log de toutes les écritures) ─────────────────
# Garantit 0 perte de données entre deux snapshots RDB
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec     # flush toutes les secondes (bon compromis)
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ── PERFORMANCE ───────────────────────────────────────────────────
tcp-keepalive 300
tcp-backlog 511
timeout 0
hz 10
lazyfree-lazy-eviction yes   # éviction non-bloquante
lazyfree-lazy-expire yes

# ── SÉCURITÉ ──────────────────────────────────────────────────────
# Décommenter et changer en production OVH (accès public)
# requirepass votre_mot_de_passe_fort
# rename-command FLUSHALL ""    # désactiver les commandes dangereuses
# rename-command FLUSHDB  ""
# rename-command DEBUG    ""