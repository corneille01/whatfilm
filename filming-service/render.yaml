# Render Blueprint pour filming-service.
# Usage : Render dashboard → "New +" → "Blueprint" → sélectionner ce repo/branche.
# Render détecte ce fichier et propose de créer le service ci-dessous. Les
# variables marquées `sync: false` sont demandées dans un formulaire au moment
# de la création — elles ne sont jamais écrites dans le repo.
services:
  - type: web
    name: pelify-filming-service
    runtime: docker
    dockerfilePath: ./filming-service/Dockerfile
    dockerContext: ./filming-service
    healthCheckPath: /api/health   # répond 200 même sans DATABASE_URL configurée
    envVars:
      - key: DATABASE_URL
        sync: false   # mysql+pymysql://ehoudb_user:PASSWORD@HOST:3306/ehou_db
      - key: FILMING_ADMIN_TOKEN
        sync: false   # protège POST /api/admin/preload-nearby
      - key: CORS_ALLOWED_ORIGINS
        value: https://pelify.app
      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter
